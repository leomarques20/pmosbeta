[build]
  command = "echo 'Build completed'"
  functions = "netlify/functions"
  publish = "."

[functions]

# Rotas específicas do SEI -> funções Node em netlify/functions/.
# Devem vir antes de qualquer regra genérica (o Netlify aplica a primeira que casar).
# Obs.: o backend/ Python (FastAPI) é apenas para desenvolvimento local — o Netlify
# Functions não executa Python, por isso não há catch-all /api/*.
[[redirects]]
  from = "/api/sei/processos"
  to = "/.netlify/functions/sei-processos"
  status = 200

[[redirects]]
  from = "/api/sei/auth/challenge"
  to = "/.netlify/functions/sei-auth-challenge"
  status = 200

[[redirects]]
  from = "/api/sei/detalhes"
  to = "/.netlify/functions/sei-detalhes-processo"
  status = 200

# Fallback: caminhos inexistentes servem o app (index.html) com status 404.
# force = false garante que arquivos estáticos existentes nunca sejam sobrescritos.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
  force = false
